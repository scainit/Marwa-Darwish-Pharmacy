<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b28">
  <title>صيدلية مروة درويش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#244b43 0,#102b28 48%,#0b1d1b 100%);font-family:"Cairo",Arial,sans-serif;color:#fff}
    main{width:min(100%,520px);text-align:center}.mark{width:66px;height:66px;margin:0 auto 22px;border:1px solid #b8d8c8;border-radius:22px;display:grid;place-items:center;color:#c7e4d4;font-size:30px}
    .eyebrow{color:#b9d7c7;font-size:13px;letter-spacing:1px;margin:0 0 8px}h1{font-size:clamp(27px,6vw,38px);margin:0 0 10px;font-weight:800}.sub{color:#c5d5ce;margin:0 0 34px;font-size:15px}
    .branches{display:grid;gap:14px}.branch{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#17352e;background:#f4f7f4;border-radius:18px;padding:19px 22px;transition:transform .2s,background .2s}.branch:hover{transform:translateY(-3px);background:#fff}.branch strong{font-size:18px}.arrow{font-size:22px;color:#507b68}
    footer{margin-top:34px;color:#91aaa0;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✚</div>
    <p class="eyebrow">أهلاً بك</p>
    <h1>مرحباً بك في صيدلية مروة درويش</h1>
    <p class="sub">من فضلك اختر الفرع</p>
    <nav class="branches" aria-label="اختيار الفرع">
      <a class="branch" href="maadi.html"><strong>فرع المعادي</strong><span class="arrow">←</span></a>
      <a class="branch" href="mokattam.html"><strong>فرع المقطم</strong><span class="arrow">←</span></a>
    </nav>
    <footer>صيدلية مروة درويش</footer>
  </main>
</body>
</html>
