<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#35133f">
  <title>صيدليات دكتورة مروة درويش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#754879 0,#45204f 48%,#24102c 100%);font-family:"Cairo",Arial,sans-serif;color:#fff}
    main{width:min(100%,520px);text-align:center}
    .brand-logo{display:block;width:170px;height:170px;object-fit:contain;border-radius:50%;margin:0 auto 22px;background:#fff;box-shadow:0 10px 34px #16091d66}
    .eyebrow{color:#e4c7e6;font-size:13px;letter-spacing:1px;margin:0 0 8px}
    h1{font-size:clamp(27px,6vw,38px);margin:0 0 10px;font-weight:800}
    .sub{color:#f0e3f1;margin:0 0 34px;font-size:15px}
    .branches{display:grid;gap:14px}
    .branch{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#3d1944;background:#fcf9fc;border:1px solid #eaddec;border-radius:18px;padding:19px 22px;transition:transform .2s,background .2s;box-shadow:0 5px 14px #16091d30}
    .branch:hover{transform:translateY(-3px);background:#fff}
    .branch strong{font-size:18px}
    .arrow{font-size:22px;color:#704275}
    footer{margin-top:34px;color:#d6b6d9;font-size:12px}
  </style>
</head>
<body>
  <main>
    <img class="brand-logo" src="WhatsApp%20Image%202026-11-07%20at%209.36.45%20PM.jpeg" alt="لوجو صيدليات دكتورة مروة درويش">
    <p class="eyebrow">أهلاً بك</p>
    <h1>مرحباً بك في صيدليات دكتورة مروة درويش</h1>
    <p class="sub">من فضلك اختر الفرع</p>
    <nav class="branches" aria-label="اختيار الفرع">
      <a class="branch" href="maadi.html"><strong>فرع المعادي</strong><span class="arrow">←</span></a>
      <a class="branch" href="mokattam.html"><strong>فرع المقطم</strong><span class="arrow">←</span></a>
    </nav>
    <footer>صيدليات دكتورة مروة درويش</footer>
  </main>
</body>
</html>
