<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b28">
  <title>فرع المقطم | صيدلية مروة درويش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;background:radial-gradient(circle at 50% 0,#244b43 0,#102b28 48%,#0b1d1b 100%);font-family:"Cairo",Arial,sans-serif;color:#fff}.wrap{width:min(100%,480px);margin:30px auto;text-align:center}.back{display:inline-block;color:#c5d5ce;text-decoration:none;font-size:13px;margin-bottom:30px}.mark{width:58px;height:58px;margin:0 auto 18px;border:1px solid #b8d8c8;border-radius:19px;display:grid;place-items:center;color:#c7e4d4;font-size:27px}h1{font-size:30px;margin:0 0 5px}.hint{color:#b9d7c7;margin:0 0 27px;font-size:14px}.links{display:grid;gap:11px}.link{width:100%;border:1px solid #d7e4dc;background:#f4f7f4;color:#17352e;border-radius:14px;padding:14px 18px;font:600 16px "Cairo",sans-serif;text-align:center;cursor:default}.link span{margin-left:8px;color:#507b68}footer{color:#91aaa0;font-size:12px;margin-top:28px}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">→ اختيار فرع آخر</a>
    <div class="mark" aria-hidden="true">✚</div>
    <h1>فرع المقطم</h1>
    <p class="hint">صيدلية مروة درويش</p>
    <section class="links" aria-label="روابط الفرع">
      <button class="link" type="button"><span>●</span> فيسبوك</button>
      <button class="link" type="button"><span>♪</span> تيك توك</button>
      <button class="link" type="button"><span>◎</span> إنستجرام</button>
      <button class="link" type="button"><span>◉</span> واتساب</button>
      <button class="link" type="button"><span>☎</span> اتصال – الرقم الأول</button>
      <button class="link" type="button"><span>☎</span> اتصال – الرقم الثاني</button>
      <button class="link" type="button"><span>⌖</span> موقع الفرع</button>
      <button class="link" type="button"><span>★</span> قيّمنا على Google</button>
    </section>
    <footer>صيدلية مروة درويش</footer>
  </main>
</body>
</html>
